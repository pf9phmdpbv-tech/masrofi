<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مصروفي</title>
  <meta name="theme-color" content="#15283B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>مصروفي</h1>
    <p class="total-label">مجموع المصروفات</p>
    <p class="total" id="total" aria-live="polite">0.00 ر.س</p>
    <p class="count" id="count"></p>
  </header>

  <main>
    <form id="form" class="card" novalidate>
      <div class="field">
        <label for="amount">المبلغ (ر.س)</label>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="مثال: 25.50">
      </div>

      <div class="field">
        <label for="item">البند</label>
        <input id="item" type="text" maxlength="60" autocomplete="off" placeholder="مثال: غداء، مواصلات، كتب">
      </div>

      <div class="field">
        <label for="date">التاريخ</label>
        <input id="date" type="date">
      </div>

      <p class="error" id="error" role="alert" hidden></p>

      <button type="submit" class="add">إضافة المصروف</button>
    </form>

    <section class="list-section" aria-labelledby="list-title">
      <h2 id="list-title">المصروفات</h2>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">لا توجد مصروفات بعد. أدخل المبلغ والبند ثم اضغط «إضافة المصروف».</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
